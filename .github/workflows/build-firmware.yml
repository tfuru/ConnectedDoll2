name: Build & Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'debug-*'
    paths:
      - 'board/firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build ESP32-C3 Firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        working-directory: board/firmware
        run: |
          make build

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            board/firmware/.pio/build/seeed_xiao_esp32c3/firmware.bin
            board/firmware/.pio/build/seeed_xiao_esp32c3/bootloader.bin
            board/firmware/.pio/build/seeed_xiao_esp32c3/partitions.bin
          retention-days: 14

      - name: Upload Firmware to GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            board/firmware/.pio/build/seeed_xiao_esp32c3/firmware.bin
            board/firmware/.pio/build/seeed_xiao_esp32c3/bootloader.bin
            board/firmware/.pio/build/seeed_xiao_esp32c3/partitions.bin
          prerelease: ${{ startsWith(github.ref, 'refs/tags/debug-') }}
